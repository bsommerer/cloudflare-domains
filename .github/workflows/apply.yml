name: Apply sites (reusable)

# Reusable Workflow für das zentrale Config-Repo: wendet dessen `sites/` auf
# Cloudflare an. GitOps-Quelle der Wahrheit ist damit das Config-Repo, nicht
# dieses Repo – die Engine deployt nichts von sich aus.
#
# Aufruf aus dem Config-Repo (.github/workflows/deploy-domains.yml):
#   on:
#     push:
#       branches: [main]
#       paths: ['sites/**']
#   jobs:
#     domains:
#       uses: bsommerer/cloudflare-domains/.github/workflows/apply.yml@v1
#       with:
#         state_bucket: tfstate
#       secrets:
#         CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
#         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

on:
  workflow_call:
    inputs:
      engine_ref:
        description: Git-Ref (Tag/Branch) der Engine, die angewendet wird
        type: string
        default: main
      sites_dir:
        description: Verzeichnis mit den Site-Dateien im Config-Repo
        type: string
        default: sites
      state_bucket:
        description: R2-Bucket für den Terraform-State
        type: string
        required: true
      state_key:
        description: Objekt-Key des States im Bucket
        type: string
        default: cloudflare-domains.tfstate
      environment:
        description: GitHub-Environment für den Apply-Job (z. B. für ein Approval-Gate)
        type: string
        default: ""
      builds_allow_delete:
        description: Verwaiste `cfd:`-Trigger der Workers Builds löschen (Site oder builds-Block entfernt)
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      # Beide optional, nur für `builds`-Blöcke – siehe README, Abschnitt
      # "Workers Builds". Ohne eigenes Token gilt CLOUDFLARE_API_TOKEN.
      CLOUDFLARE_BUILDS_API_TOKEN:
        required: false
      BUILDS_GITHUB_TOKEN:
        required: false

# Zwei parallele Applies würden sich um denselben State streiten.
concurrency:
  group: cloudflare-domains-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Config-Repo auschecken (Caller)
        uses: actions/checkout@v4
        with:
          path: config

      - name: Engine auschecken
        uses: actions/checkout@v4
        with:
          repository: bsommerer/cloudflare-domains
          ref: ${{ inputs.engine_ref }}
          path: engine

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: R2-Zugangsdaten aus dem API-Token ableiten
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cloudflare leitet die S3-Zugangsdaten aus dem API-Token ab:
          # Access Key ID = Token-ID, Secret Access Key = SHA-256 des Werts.
          # Deshalb braucht der State kein eigenes Credential – es genügt, dass
          # das Token "Workers R2 Storage: Edit" hat.
          ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
                 | jq -r '.result.id')
          # Account-eigene Tokens antworten nur unter /accounts/...; nutzerbezogene
          # nur unter /user/... – deshalb der Fallback.
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                   "https://api.cloudflare.com/client/v4/user/tokens/verify" \
                   | jq -r '.result.id')
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "Token-ID nicht ermittelbar - hat das Token Zugriff auf den Account?" >&2
            exit 1
          fi
          SECRET=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$SECRET"
          {
            echo "AWS_ACCESS_KEY_ID=$ID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET"
            echo "AWS_ENDPOINT_URL_S3=https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          } >> "$GITHUB_ENV"

      - name: Backend einsetzen
        run: cp engine/ci/backend.tf engine/backend.tf

      - name: Init
        working-directory: engine
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=${{ inputs.state_key }}"

      # Erst planen, dann genau diesen Plan anwenden. Ohne die Plan-Datei
      # könnte zwischen Plan und Apply etwas anderes passieren.
      - name: Plan
        working-directory: engine
        env:
          TF_VAR_sites_dir: ${{ github.workspace }}/config/${{ inputs.sites_dir }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        working-directory: engine
        env:
          TF_VAR_sites_dir: ${{ github.workspace }}/config/${{ inputs.sites_dir }}
        run: terraform apply -input=false -no-color tfplan

      - name: Ergebnis in die Job-Summary
        if: success()
        working-directory: engine
        env:
          TF_VAR_sites_dir: ${{ github.workspace }}/config/${{ inputs.sites_dir }}
        run: |
          {
            echo "### cloudflare-domains – angewendet"
            echo ""
            echo '```json'
            terraform output -json sites
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Workers Builds hat keine Terraform-Resource, deshalb ein eigener
      # Abgleich nach dem Apply. Ohne `builds`-Block in den Site-Dateien ein
      # No-Op ohne einen einzigen API-Aufruf.
      - name: Workers Builds abgleichen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILDS_GITHUB_TOKEN: ${{ secrets.BUILDS_GITHUB_TOKEN }}
          BUILDS_SUMMARY_OUT: ${{ runner.temp }}/builds.md
          ALLOW_DELETE: ${{ inputs.builds_allow_delete && '--allow-delete' || '' }}
        run: |
          set +e
          node engine/scripts/reconcile-builds/reconcile-builds.mjs apply \
            --sites-dir "config/${{ inputs.sites_dir }}" $ALLOW_DELETE
          rc=$?
          [ -f "$BUILDS_SUMMARY_OUT" ] && cat "$BUILDS_SUMMARY_OUT" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
