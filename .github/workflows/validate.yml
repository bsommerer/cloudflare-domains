name: Validate sites (reusable)

# Reusable Workflow für das zentrale Config-Repo: prüft dessen `sites/` gegen
# diese Engine und zeigt den `terraform plan` als PR-Kommentar – ohne etwas zu
# verändern.
#
# Aufruf aus dem Config-Repo (.github/workflows/ci.yml):
#   on:
#     pull_request:
#   jobs:
#     domains:
#       uses: bsommerer/cloudflare-domains/.github/workflows/validate.yml@v1
#       permissions:
#         contents: read
#         pull-requests: write
#       with:
#         state_bucket: tfstate
#       secrets:
#         CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
#         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#         REPO_READ_TOKEN:       ${{ secrets.REPO_READ_TOKEN }}   # optional, siehe README

on:
  workflow_call:
    inputs:
      engine_ref:
        description: Git-Ref (Tag/Branch) der Engine, gegen die geprüft wird
        type: string
        default: main
      sites_dir:
        description: Verzeichnis mit den Site-Dateien im Config-Repo
        type: string
        default: sites
      state_bucket:
        description: R2-Bucket für den Terraform-State
        type: string
        required: true
      state_key:
        description: Objekt-Key des States im Bucket
        type: string
        default: cloudflare-domains.tfstate
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      REPO_READ_TOKEN:
        description: >-
          GitHub-Token mit Contents: Read auf die Worker-Repos (`repo` in den
          Site-Dateien). Ohne das Secret läuft die wrangler-Prüfung nur mit
          Warnungen – private Repos sind mit dem GITHUB_TOKEN des Config-Repos
          nicht lesbar.
        required: false
      # Beide optional, nur für `builds`-Blöcke – siehe README, Abschnitt
      # "Workers Builds". Ohne eigenes Token gilt CLOUDFLARE_API_TOKEN.
      CLOUDFLARE_BUILDS_API_TOKEN:
        required: false
      BUILDS_GITHUB_TOKEN:
        required: false

jobs:
  # Eigener Job: braucht weder Terraform noch Cloudflare-Zugang und soll auch
  # dann Feedback geben, wenn der Plan scheitert.
  wrangler:
    runs-on: ubuntu-latest
    steps:
      - name: Config-Repo auschecken (Caller)
        uses: actions/checkout@v4
        with:
          path: config

      - name: Engine auschecken
        uses: actions/checkout@v4
        with:
          repository: bsommerer/cloudflare-domains
          ref: ${{ inputs.engine_ref }}
          path: engine

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: wrangler-Konfiguration gegen die Sites prüfen
        working-directory: config
        env:
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        run: |
          # Ohne Token sind private Repos nicht lesbar: dann nur warnen,
          # statt jeden PR des Config-Repos rot zu färben.
          FLAGS=""
          if [ -z "$REPO_READ_TOKEN" ]; then
            echo "::notice::REPO_READ_TOKEN nicht gesetzt - nicht lesbare Repos werden nur als Warnung gemeldet."
            FLAGS="--allow-missing"
          fi
          node ../engine/scripts/check-wrangler/cli.mjs "${{ inputs.sites_dir }}" $FLAGS

  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Config-Repo auschecken (Caller)
        uses: actions/checkout@v4
        with:
          path: config

      - name: Engine auschecken
        uses: actions/checkout@v4
        with:
          repository: bsommerer/cloudflare-domains
          ref: ${{ inputs.engine_ref }}
          path: engine

      # Schnelles, credential-freies Feedback: ein Tippfehler im JSON soll den
      # PR abbrechen, bevor überhaupt jemand mit Cloudflare spricht.
      - name: JSON-Schema prüfen
        working-directory: config
        run: |
          shopt -s nullglob
          files=("${{ inputs.sites_dir }}"/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Keine Site-Dateien in ${{ inputs.sites_dir }}/ gefunden." >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            [ "$(basename "$f")" = "_defaults.json" ] && continue
            echo "-> $f"
            npx --yes ajv-cli@5 validate \
              --spec=draft2020 --strict=false \
              -s ../engine/schema/domains.schema.json -d "$f"
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: R2-Zugangsdaten aus dem API-Token ableiten
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cloudflare leitet die S3-Zugangsdaten aus dem API-Token ab:
          # Access Key ID = Token-ID, Secret Access Key = SHA-256 des Werts.
          # Deshalb braucht der State kein eigenes Credential – es genügt, dass
          # das Token "Workers R2 Storage: Edit" hat.
          ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
                 | jq -r '.result.id')
          # Account-eigene Tokens antworten nur unter /accounts/...; nutzerbezogene
          # nur unter /user/... – deshalb der Fallback.
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                   "https://api.cloudflare.com/client/v4/user/tokens/verify" \
                   | jq -r '.result.id')
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "Token-ID nicht ermittelbar - hat das Token Zugriff auf den Account?" >&2
            exit 1
          fi
          SECRET=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$SECRET"
          {
            echo "AWS_ACCESS_KEY_ID=$ID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET"
            echo "AWS_ENDPOINT_URL_S3=https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          } >> "$GITHUB_ENV"

      - name: Backend einsetzen
        run: cp engine/ci/backend.tf engine/backend.tf

      - name: Init
        working-directory: engine
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=${{ inputs.state_key }}"

      - name: Plan
        id: plan
        working-directory: engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_sites_dir: ${{ github.workspace }}/config/${{ inputs.sites_dir }}
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color 2>&1 | tee "${RUNNER_TEMP}/plan.txt"

      - name: Plan als PR-Kommentar
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLAN=$(tail -c 60000 "${RUNNER_TEMP}/plan.txt")
          {
            echo "### Terraform-Plan – cloudflare-domains"
            echo ""
            echo "Ergebnis: \`${{ steps.plan.outcome }}\`"
            echo ""
            echo '```terraform'
            echo "$PLAN"
            echo '```'
          } > "${RUNNER_TEMP}/comment.md"
          cat "${RUNNER_TEMP}/comment.md" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file "${RUNNER_TEMP}/comment.md"

      # Plan des Workers-Builds-Abgleichs: liest nur, schreibt nie. Läuft auch,
      # wenn der Terraform-Plan scheitert – die beiden sind unabhängig.
      - name: Workers-Builds-Plan
        id: builds
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILDS_GITHUB_TOKEN: ${{ secrets.BUILDS_GITHUB_TOKEN }}
          BUILDS_SUMMARY_OUT: ${{ runner.temp }}/builds.md
        run: |
          set +e
          node engine/scripts/reconcile-builds/reconcile-builds.mjs plan \
            --sites-dir "config/${{ inputs.sites_dir }}"
          rc=$?
          [ -f "$BUILDS_SUMMARY_OUT" ] && cat "$BUILDS_SUMMARY_OUT" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Workers-Builds-Plan als PR-Kommentar
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${RUNNER_TEMP}/builds.md"
          # Ohne builds-Block kein Kommentar – bestehende Config-Repos sollen
          # davon nichts merken.
          [ -f "$f" ] || exit 0
          grep -q 'Keine Site mit `builds`-Block' "$f" && exit 0
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file "$f"
